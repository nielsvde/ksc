<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotisaver & AI MP3 Splitter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      background: radial-gradient(circle at top, #1a1f36 0%, #0a0c16 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px 16px;
      gap: 20px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #121829;
      border: 1px solid #2a3454;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(107, 70, 193, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #38bdf8;
      font-weight: 600;
      margin-bottom: 6px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background-color: #1a2238;
      border: 1px solid #3b82f6;
      border-radius: 10px;
      color: #ffffff;
      padding: 10px 12px;
      font-size: 13px;
      outline: none;
    }

    .btn-action {
      background: #1db954;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      margin-top: 8px;
    }

    .btn-secondary {
      width: 100%;
      background: #1a2238;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      border-radius: 12px;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-top: 8px;
    }

    .btn-main:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .card {
      background-color: #1a2238;
      border: 1px solid #2e3a59;
      border-radius: 12px;
      padding: 12px;
      margin-top: 14px;
    }

    .status-text {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <!-- Blok 1: MP3, Splitter & Songtekst Acties -->
  <div class="container">
    <h1>MP3 & Tools</h1>

    <div class="section-title">Stap 1: Zoek nummer op Spotify</div>
    <div class="input-row">
      <input type="text" id="searchQuery" placeholder="Bijv. Artist - Nummer titel">
      <button class="btn-action" onclick="searchSpotify()">Zoek 🔍</button>
    </div>

    <div class="section-title">Stap 2: Plak Spotify Link</div>
    <div class="input-row">
      <input type="text" id="spotifyUrl" placeholder="Plak hier de Spotify-link...">
      <button class="btn-action" onclick="pasteFromClipboard('spotifyUrl')">Plak 📋</button>
    </div>

    <button class="btn-main" onclick="processLink()">Genereer & Open Direct →</button>

    <button class="btn-main" onclick="window.open('https://vocalremover.org/next/nl/', '_blank')">
      Open VocalRemover AI Splitter ✂️
    </button>

    <button class="btn-main" id="lyricsBtn" onclick="fetchLyricsDirect()">
      Haal Songtekst Op 🎤
    </button>
  </div>

  <!-- Blok 2: Songtekst Resultaat -->
  <div class="container">
    <h1>Songtekst</h1>

    <div class="card" style="margin-top: 0;">
      <div class="status-text" id="lyricsResult">
<b>💡 LRCLIB Integratie:</b>
Plak een Spotify-link bovenaan bij Stap 2 of vul bij Stap 1 een zoekterm in en klik op 'Haal Songtekst Op 🎤'.
      </div>
    </div>
  </div>

  <script>
    let currentLyrics = "";
    let currentFileName = "songtekst.lrc";

    function searchSpotify() {
      const q = document.getElementById('searchQuery').value.trim();
      if (q) window.open(`https://open.spotify.com/search/${encodeURIComponent(q)}`, '_blank');
    }

    async function pasteFromClipboard(inputId) {
      try {
        const text = await navigator.clipboard.readText();
        if (text) document.getElementById(inputId).value = text;
      } catch (err) {
        alert('Plak handmatig.');
      }
    }

    function processLink() {
      const input = document.getElementById('spotifyUrl').value.trim();
      const match = input.match(/track\/([a-zA-Z0-9]+)/);
      if (match && match[1]) {
        window.open(`https://spotisaver.net/en/track/${match[1]}`, '_blank');
      } else {
        alert('Geen geldige Spotify link.');
      }
    }

    async function fetchLyricsDirect() {
      const spotifyUrlInput = document.getElementById('spotifyUrl').value.trim();
      const searchQueryInput = document.getElementById('searchQuery').value.trim();
      const rawInput = spotifyUrlInput || searchQueryInput;

      const resultBox = document.getElementById('lyricsResult');
      const btn = document.getElementById('lyricsBtn');

      if (!rawInput) {
        alert('Plak eerst een Spotify link bij Stap 2 of vul een zoekterm in bij Stap 1.');
        return;
      }

      btn.disabled = true;
      resultBox.innerHTML = `<b style="color:#38bdf8;">⏳ Zoeken...</b> Songtekst wordt opgehaald.`;

      const match = rawInput.match(/track\/([a-zA-Z0-9]+)/);
      const trackId = match ? match[1] : null;

      try {
        let item = null;

        if (trackId) {
          try {
            const res = await fetch(`https://lrclib.net/api/get-by-spotify-id/${trackId}`);
            if (res.ok) item = await res.json();
          } catch (e) {
            console.log("Spotify ID direct niet gevonden, overschakelen op Spotify metadata...");
          }

          if (!item || (!item.syncedLyrics && !item.plainLyrics)) {
            try {
              const metaRes = await fetch(`https://open.spotify.com/oembed?url=https://open.spotify.com/track/${trackId}`);
              if (metaRes.ok) {
                const meta = await metaRes.json();
                const cleanQuery = meta.title;
                const searchRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanQuery)}`);
                if (searchRes.ok) {
                  const searchData = await searchRes.json();
                  if (searchData && searchData.length > 0) item = searchData[0];
                }
              }
            } catch (e) {
              console.log("Fallback mislukt");
            }
          }
        } else {
          const searchRes = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(rawInput)}`);
          if (searchRes.ok) {
            const searchData = await searchRes.json();
            if (searchData && searchData.length > 0) item = searchData[0];
          }
        }

        if (item && (item.syncedLyrics || item.plainLyrics)) {
          currentLyrics = item.syncedLyrics || item.plainLyrics;
          currentFileName = `${item.artistName} - ${item.trackName}.lrc`.replace(/[/\\?%*:|"<>]/g, '');

          resultBox.innerHTML = `
            <b style="color:#4ade80;">✓ Gevonden!</b><br>
            <b>🎵 ${item.artistName} - ${item.trackName}</b><br><br>
            <button class="btn-secondary" onclick="downloadLrcFile()" style="margin-bottom: 12px; border-color: #1db954; color: #1db954;">
              Download .LRC Bestand 💾
            </button>
            <div style="font-family: monospace; font-size: 11px; white-space: pre-wrap;">${currentLyrics}</div>
          `;
        } else {
          resultBox.innerHTML = `<b style="color:#ef4444;">Niet gevonden:</b> Geen songtekst aangetroffen in de database voor deze track.`;
        }
      } catch (err) {
        resultBox.innerHTML = `<b style="color:#ef4444;">Fout:</b> Er ging iets mis bij het ophalen van de songtekst.`;
      } finally {
        btn.disabled = false;
      }
    }

    function downloadLrcFile() {
      if (!currentLyrics) return;
      const blob = new Blob([currentLyrics], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = currentFileName;
      a.click();
    }
  </script>
</body>
</html>
