<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotisaver Link Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d1117;
      background: radial-gradient(circle at top, #1a1f36 0%, #0a0c16 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      background: #121829;
      border: 1px solid #2a3454;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(107, 70, 193, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 2px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 14px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #38bdf8;
      font-weight: 600;
    }

    .btn-paste {
      background: #1e293b;
      border: 1px solid #3b82f6;
      color: #38bdf8;
      border-radius: 6px;
      padding: 3px 6px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .input-row {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background-color: #1a2238;
      border: 1px solid #3b82f6;
      border-radius: 8px;
      color: #ffffff;
      padding: 8px 10px;
      font-size: 13px;
      outline: none;
    }

    textarea {
      width: 100%;
      height: 52px;
      background-color: #1a2238;
      border: 1px solid #5b21b6;
      border-radius: 8px;
      color: #ffffff;
      padding: 8px 10px;
      font-size: 12px;
      resize: none;
      outline: none;
      margin-bottom: 10px;
    }

    .btn-spotify {
      background: #1db954;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .btn-main {
      width: 100%;
      background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .card {
      background-color: #1a2238;
      border: 1px solid #2e3a59;
      border-radius: 10px;
      padding: 10px;
      margin-top: 12px;
    }

    .status-text {
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.3;
    }

    .link-box {
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 6px;
      border-radius: 6px;
      word-break: break-all;
      font-family: monospace;
      margin-top: 4px;
      font-size: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Spotisaver Link Generator</h1>
    <p class="subtitle">Genereer direct de specifieke Spotisaver track-URL</p>

    <!-- Stap 1: Zoeken op Spotify -->
    <div class="section-title" style="margin-bottom: 6px;">Stap 1: Zoek nummer op Spotify</div>
    <div class="input-row">
      <input type="text" id="searchQuery" placeholder="Bijv. Artist - Nummer titel">
      <button class="btn-spotify" onclick="searchSpotify()">Zoek 🔍</button>
    </div>

    <!-- Stap 2: Link converteren & direct openen -->
    <div class="section-header">
      <div class="section-title">Stap 2: Plak Spotify Link</div>
      <button class="btn-paste" onclick="pasteFromClipboard()">📋 Plak</button>
    </div>
    <textarea id="spotifyUrl" placeholder="Plak hier de Spotify-link (https://open.spotify.com/track/...)"></textarea>

    <button class="btn-main" onclick="processLink()">
      Genereer & Open Direct →
    </button>

    <div class="card">
      <div class="status-text" id="statusDetail">
        <b>Hoe werkt het?</b><br>
        1. Typ een titel en zoek.<br>
        2. Kopieer de track-link in Spotify.<br>
        3. Klik op 'Plak' en daarna op 'Genereer & Open Direct'.
      </div>
    </div>
  </div>

  <script>
    // 1. Opent Spotify Zoekpagina
    function searchSpotify() {
      const query = document.getElementById('searchQuery').value.trim();
      if (query !== '') {
        const spotifySearchUrl = `https://open.spotify.com/search/${encodeURIComponent(query)}`;
        window.open(spotifySearchUrl, '_blank');
      } else {
        alert('Vul eerst een artiest of nummertitel in.');
      }
    }

    // 2. Plakken van Klembord
    async function pasteFromClipboard() {
      const statusDetail = document.getElementById('statusDetail');
      try {
        const text = await navigator.clipboard.readText();
        if (text) {
          document.getElementById('spotifyUrl').value = text;
          statusDetail.innerHTML = `<b style="color:#4ade80;">✓ Link geplakt!</b> Klik op 'Genereer & Open Direct'.`;
        } else {
          alert('Klembord is leeg.');
        }
      } catch (err) {
        alert('Geen toestemming voor klembord. Plak handmatig.');
      }
    }

    // 3. Maakt de specifieke Spotisaver URL en opent deze direct
    function processLink() {
      const input = document.getElementById('spotifyUrl').value.trim();
      const statusDetail = document.getElementById('statusDetail');

      const regex = /track\/([a-zA-Z0-9]+)/;
      const match = input.match(regex);

      if (match && match[1]) {
        const trackId = match[1];
        const targetUrl = `https://spotisaver.net/en/track/${trackId}`;

        statusDetail.innerHTML = `
          <b style="color:#4ade80;">✓ Link Gegenereerd!</b><br>
          <div class="link-box">${targetUrl}</div>
          <i>Wordt nu geopend...</i>
        `;

        window.open(targetUrl, '_blank');

      } else {
        statusDetail.innerHTML = `<b style="color:#ef4444;">Fout:</b> Geen geldige Spotify track-link gevonden.`;
      }
    }
  </script>
</body>
</html>
