<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotisaver Link Generator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      background: radial-gradient(circle at top, #1a1f36 0%, #0a0c16 100%);
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #121829;
      border: 1px solid #2a3454;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 15px rgba(107, 70, 193, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #a78bfa 0%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    textarea {
      width: 100%;
      height: 80px;
      background-color: #1a2238;
      border: 2px solid #5b21b6;
      border-radius: 12px;
      color: #ffffff;
      padding: 12px;
      font-size: 14px;
      resize: none;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: #9333ea;
      box-shadow: 0 0 10px rgba(147, 51, 234, 0.3);
    }

    textarea::placeholder {
      color: #64748b;
    }

    .btn {
      width: 100%;
      background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: transform 0.1s, opacity 0.2s;
    }

    .btn:hover {
      opacity: 0.95;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .card {
      background-color: #1a2238;
      border: 1px solid #2e3a59;
      border-radius: 12px;
      padding: 16px;
      margin-top: 20px;
    }

    .status-title {
      font-size: 14px;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .converted-info {
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 16px;
      word-break: break-all;
    }

    .status-sub {
      font-size: 12px;
      color: #64748b;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-text {
      font-size: 13px;
      color: #94a3b8;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Spotisaver Link Generator</h1>
    <p class="subtitle">Zet Spotify tracks om naar downloadpagina's</p>

    <div class="input-group">
      <textarea id="spotifyUrl" placeholder="Plak hier je Spotify track link (bijv. https://open.spotify.com/track/...)"></textarea>
    </div>

    <button class="btn" onclick="processLink()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path>
      </svg>
      Genereer & Open Spotisaver Pagina
      <span style="font-size: 18px;">→</span>
    </button>

    <div class="card">
      <div class="status-title" id="statusHeader">Status: Wachtend op link...</div>
      <div class="converted-info" id="convertedResult" style="display: none;"></div>
      
      <div class="status-sub">Status</div>
      <div class="status-text" id="statusDetail">
        Voer een Spotify-link in en klik op de knop om direct de juiste pagina op Spotisaver te openen.
      </div>
    </div>
  </div>

  <script>
    function processLink() {
      const input = document.getElementById('spotifyUrl').value.trim();
      const statusHeader = document.getElementById('statusHeader');
      const convertedResult = document.getElementById('convertedResult');
      const statusDetail = document.getElementById('statusDetail');

      // Check of er een spotify track ID aanwezig is
      const regex = /track\/([a-zA-Z0-9]+)/;
      const match = input.match(regex);

      if (match && match[1]) {
        const trackId = match[1];
        const targetUrl = `https://spotisaver.net/en/track/${trackId}/`;

        statusHeader.innerText = "Gereed! Link geconverteerd";
        convertedResult.style.display = "block";
        convertedResult.innerText = `Track ID: ${trackId}`;
        statusDetail.innerText = "Je gegenereerde Spotisaver link staat klaar. Je wordt nu doorgestuurd naar de browser. Je verlaat deze app tijdelijk.";

        // Open direct in een nieuw tabblad
        setTimeout(() => {
          window.open(targetUrl, '_blank');
        }, 800);

      } else {
        statusHeader.innerText = "Status: Ongeldige URL";
        convertedResult.style.display = "none";
        statusDetail.innerText = "Zorg ervoor dat je een geldige Spotify track-link invoert (bijv. https://open.spotify.com/track/6JVKEpB8VQmt1LYRxNmdK0).";
      }
    }
  </script>
</body>
</html>
